<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>状态 · His Pulse</title>

<meta name="theme-color" content="#0e0a21">

<style>
/* ═══════════════ Motra · 夜空皮肤(Night Royal) ═══════════════
   深空为底、月光为卡、金色描边。素材:web/assets/night/(星月金框/塔罗白描/夜空壁纸) */
@font-face{ font-family:"GreatVibes"; src:url("fonts/great-vibes.woff2") format("woff2"); font-display:swap; }
@font-face{ font-family:"Cormorant"; src:url("fonts/cormorant.woff2") format("woff2"); font-display:swap; }

:root{
  --font-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-serif:"Cormorant","Songti SC","Noto Serif SC",serif;
  --font-vibes:"GreatVibes","Cormorant",cursive;

  --bg-0:#0d0920; --bg-1:#171233; --bg-2:#221a48;
  --ink:#efeaf9; --ink-dim:#a79fca; --ink-faint:#6f66a0;
  --gold:#e3c284; --gold-strong:#c9a24b; --gold-dim:rgba(227,194,132,.38);
  --violet:#b9a8e8;
  --card:linear-gradient(165deg,#f7f2ff 0%,#ece3fc 55%,#e0d4f7 100%);
  --card-ink:#2b2342; --card-ink-dim:#6f658c;
  --danger:#e07a6a;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg-0); color:var(--ink);
  font-family:var(--font-cn); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
/* 深空:夜空壁纸 + 渐变压暗 + 星点 */
.wall{ position:fixed; inset:0; z-index:-2;
  background:
    linear-gradient(180deg,rgba(13,9,32,.55) 0%,rgba(13,9,32,.82) 55%,rgba(13,9,32,.96) 100%),
    url("assets/night/sky-cloud.webp") center/cover no-repeat, var(--bg-0); }
.wall::before{ content:""; position:absolute; inset:0; opacity:.5;
  background-image:
    radial-gradient(1.4px 1.4px at 12% 18%, #fff 60%, transparent 61%),
    radial-gradient(1px 1px at 78% 8%, #ffe9b8 60%, transparent 61%),
    radial-gradient(1.2px 1.2px at 34% 42%, #fff 60%, transparent 61%),
    radial-gradient(1px 1px at 58% 26%, #d9cfff 60%, transparent 61%),
    radial-gradient(1.6px 1.6px at 88% 48%, #fff 60%, transparent 61%),
    radial-gradient(1px 1px at 6% 66%, #ffe9b8 60%, transparent 61%),
    radial-gradient(1.2px 1.2px at 46% 78%, #fff 60%, transparent 61%),
    radial-gradient(1px 1px at 72% 88%, #d9cfff 60%, transparent 61%); }
button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
.hidden{ display:none !important; }

/* ───────── 顶栏 ───────── */
.bar{
  position:sticky; top:0; z-index:30; display:flex; align-items:flex-start; gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) clamp(16px,5vw,28px) 4px;
  background:linear-gradient(180deg,rgba(13,9,32,.85),rgba(13,9,32,0));
}
.bar .icon{ width:36px; height:36px; margin-top:-3px; margin-left:-7px; display:grid; place-items:center;
  border-radius:50%; color:var(--gold); transition:background .2s; }
.bar .icon:active{ background:rgba(227,194,132,.15); }
.bar .icon svg{ width:22px; height:22px; }
.bar .grow{ flex:1; }
.top-label{ font-family:var(--font-serif); font-size:10.5px; letter-spacing:.34em; text-align:right;
  color:var(--gold); text-transform:uppercase; line-height:1.5; padding-top:2px; }
.top-label .rule{ display:block; width:100%; height:1px; margin-top:3px;
  background:linear-gradient(90deg,transparent,var(--gold-dim)); }

/* ───────── 布局 ───────── */
.wrap{ max-width:560px; margin:0 auto; padding:6px clamp(16px,5vw,28px) calc(30px + env(safe-area-inset-bottom)); }
.hero{ text-align:center; padding:18px 0 6px; }
.hero .ornament{ width:150px; opacity:.95; filter:drop-shadow(0 0 10px rgba(227,194,132,.25));
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 96%); mask-image:linear-gradient(180deg,#000 55%,transparent 96%); }
.hero h1{ font-family:var(--font-serif); font-weight:500; font-size:clamp(30px,8vw,38px);
  letter-spacing:.14em; margin:6px 0 0; color:var(--ink); }
.hero .sub{ font-family:var(--font-vibes); font-size:22px; color:var(--gold); margin-top:2px; }
.divider{ display:block; width:78%; max-width:420px; margin:10px auto 18px; opacity:.85; }

/* ───────── 月光卡 ───────── */
.card{
  position:relative; border-radius:22px; padding:20px 18px 16px; margin-bottom:16px;
  background:var(--card); color:var(--card-ink);
  border:1px solid var(--gold-dim);
  box-shadow:0 10px 30px rgba(5,2,20,.45), 0 0 0 4px rgba(227,194,132,.06), inset 0 1px 0 rgba(255,255,255,.65);
  animation:sheetIn .4s cubic-bezier(.22,1,.36,1) both;
}
.card h2{ margin:0 0 2px; font-family:var(--font-serif); font-size:17px; font-weight:600; letter-spacing:.1em; }
.card .csub{ font-size:11.5px; color:var(--card-ink-dim); margin-bottom:12px; letter-spacing:.06em; }

/* 心跳卡:全场焦点,描金双框 */
.card.pulse{ border:1.5px solid var(--gold); box-shadow:0 12px 36px rgba(5,2,20,.55), 0 0 24px rgba(227,194,132,.12), inset 0 1px 0 rgba(255,255,255,.7); }
.card.pulse::before{ content:"✦"; position:absolute; top:10px; right:14px; color:var(--gold-strong); font-size:13px; }

.barrow{ display:flex; align-items:center; gap:10px; padding:5px 0; }
.barrow .name{ flex:0 0 4.2em; font-size:13px; color:var(--card-ink-dim); }
.barrow .track{ flex:1; height:8px; border-radius:99px; background:rgba(43,35,66,.10); overflow:hidden; }
.barrow .fill{ display:block; height:100%; border-radius:99px; transition:width .45s ease;
  background:linear-gradient(90deg,#7a5fd0,#c9a24b); }
.barrow .num{ flex:0 0 3.2em; text-align:right; font-size:12.5px; color:var(--card-ink); }
.barrow .delta{ flex:0 0 1em; font-size:11px; line-height:1; }
.barrow .delta.up{ color:#c05a4a; }
.barrow .delta.down{ color:#3f9a78; }

.chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
.chip{ font-size:12px; color:var(--card-ink-dim); background:rgba(255,255,255,.5);
  border:1px solid var(--gold-dim); border-radius:99px; padding:4px 12px; }

.note{ font-size:12.5px; color:var(--card-ink-dim); text-align:center; padding:10px 6px; line-height:1.8; }
.hint{ text-align:center; font-size:12px; color:var(--ink-faint); margin:6px 0 2px; }

/* 玩具卡按钮(深空金边) */
.toy-btn{ padding:7px 12px; border:1px solid var(--gold-dim); border-radius:99px;
  background:var(--bg-2); color:var(--gold); font-size:13px;
  box-shadow:0 3px 10px rgba(5,2,20,.4); }
.toy-btn:active{ transform:scale(.96); }
.toy-btn:disabled{ opacity:.38; }
.toy-btn.primary{ background:linear-gradient(160deg,#e9cf93,#c9a24b); color:#241c08; border-color:transparent; font-weight:600; }
.toy-input{ padding:7px 10px; border:1px solid var(--gold-dim); border-radius:12px;
  background:var(--bg-2); color:var(--ink); font-size:13px; outline:none; }
input[type="range"]{ accent-color:var(--gold-strong); }

/* gate 门 */
.gatebox{ background:var(--card); color:var(--card-ink); border:1px solid var(--gold-dim); border-radius:22px; padding:22px 20px;
  box-shadow:0 10px 30px rgba(5,2,20,.45); margin-top:8px; }
.gatebox p{ font-size:13px; color:var(--card-ink-dim); text-align:center; margin:0 0 14px; line-height:1.6; }
.gatebox input{ width:100%; padding:11px 14px; border:1px solid var(--gold-dim); border-radius:12px;
  background:rgba(255,255,255,.6); color:var(--card-ink); font-family:var(--font-cn); font-size:14px; outline:none; }
.gatebox .row{ display:flex; gap:10px; margin-top:14px; }
.gatebox .row button{ flex:1; padding:12px; border-radius:99px; font-size:14px; transition:transform .15s; }
.gatebox .row button:active{ transform:scale(.96); }
.gatebox .row .ghost{ background:transparent; border:1px solid var(--gold-dim); color:var(--card-ink-dim); }
.gatebox .row .send{ background:linear-gradient(160deg,#e9cf93,#c9a24b); color:#241c08; font-weight:600; }

@keyframes sheetIn{ from{ opacity:0; transform:translateY(20px) scale(.97); } }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wall"></div>

<!-- 顶栏 -->
<div class="bar">
  <button class="icon" id="topBack" title="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="icon" id="refreshBtn" title="刷新" style="margin-left:0">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
  </button>
  <span class="grow"></span>
  <div class="top-label">HIS<br>PULSE<span class="rule"></span></div>
</div>

<!-- ════════ 主页 ════════ -->
<div class="wrap" id="mainView">
  <div class="hero">
    <img class="ornament" src="assets/night/gold-11.webp" alt="">
    <h1>他的状态</h1>
    <div class="sub">His pulse, in real time</div>
  </div>
  <img class="divider" src="assets/night/gold-05.webp" alt="">

  <!-- 情绪(Drivesoid) -->
  <div class="card mind" id="mindCard">
    <h2>情绪</h2>
    <div class="csub" id="mindSub">Drivesoid 情绪引擎 · 0–100</div>
    <div id="mindBars"></div>
    <div class="chips" id="mindChips"></div>
  </div>

  <!-- 身体(Eventide) -->
  <div class="card body" id="bodyCard">
    <h2>身体</h2>
    <div class="csub" id="bodySub">Eventide 身体引擎 · 0–100</div>
    <div id="bodyBars"></div>
    <div class="chips" id="bodyChips"></div>
  </div>

  <!-- 心跳(Pulse) -->
  <div class="card pulse" id="pulseCard">
    <h2>心跳</h2>
    <div class="csub">脉 · 生理引擎</div>
    <div id="pulseMain"></div>
    <canvas id="hrCanvas" width="640" height="120" style="width:100%;height:60px;margin-top:8px;display:block"></canvas>
    <div class="chips" id="pulseChips"></div>
  </div>

  <!-- 玩具(Pulse) -->
  <div class="card" id="toyCard">
    <h2>玩具</h2>
    <div class="csub" id="toySub">脉 · 玩具系统</div>
    <div id="toyMain"></div>
    <div id="toyCtrl" style="margin-top:10px"></div>
  </div>

  <!-- 碎碎念(Pulse) -->
  <div class="card" id="murmurCard">
    <h2>碎碎念</h2>
    <div class="csub">身体的低语 · 不进聊天</div>
    <div id="murmurList"></div>
  </div>

  <div class="hint" id="liveHint"></div>
  <div class="hint hidden" id="errLine" style="color:var(--danger)"></div>
</div>

<!-- ════════ token 门 ════════ -->
<div class="wrap gate hidden" id="gateView">
  <div class="hero" style="padding-top:40px"><h1>他的状态</h1><div class="sub">his pulse, in real time</div></div>
  <div class="gatebox">
    <p>没读到访问密钥——先在主页登录，或在此粘贴密钥（与 PWA 同一个）。</p>
    <input type="text" id="gateInput" placeholder="访问密钥">
    <p class="hidden" id="gateErr" style="color:var(--danger);font-size:12.5px;text-align:center;margin:10px 0 0"></p>
    <div class="row">
      <button class="ghost" id="gateHome">去主页</button>
      <button class="send" id="gateSave">保存并进入</button>
    </div>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   His Pulse — 他的情绪与身体实时数值。
   数据:loop /loop/state-view(经 relay /app/state-view 代理):
   · drives  = Drivesoid /api/drives/status 全树(16 维 display,0..1)
   · eventide = Eventide dump_state(7 项 values,0..100)
   ───────────────────────────────────────────────────────────── */
const API_BASE="/relay";
const LS_KEY="companion_secret";
let secret=localStorage.getItem(LS_KEY)||"";

const $=(id)=>document.getElementById(id);
function authHeaders(extra){ return Object.assign({"Authorization":"Bearer "+secret}, extra||{}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function api(path,opts){
  const o=Object.assign({}, opts||{}, {headers:authHeaders((opts&&opts.headers)||{})});
  const r=await fetch(API_BASE+path, o);
  if(r.status===401){
    secret=""; localStorage.removeItem(LS_KEY);
    const g=$("gateErr"); if(g){ g.textContent="密钥没通过验证——重新输入正确的密钥再试。"; g.classList.remove("hidden"); }
    show("gate"); throw new Error("401");
  }
  if(!r.ok){ let d=""; try{ d=(await r.json()).detail; }catch(_){ } throw new Error(d||("HTTP "+r.status)); }
  return r;
}

function show(name){
  $("mainView").classList.toggle("hidden", name!=="main");
  $("gateView").classList.toggle("hidden", name!=="gate");
  window.scrollTo(0,0);
}

/* ── 中文名映射 ── */
const DIM_NAMES={
  vitality:"活力", fatigue:"疲惫", longing:"思念", intimacy:"亲密",
  possessiveness:"占有欲", lust:"情欲", jealousy:"嫉妒", anxiety:"焦虑",
  protectiveness:"保护欲", fear:"不安", contentment:"满足", elation:"雀跃",
  seeking:"期待", play:"玩心", dejection:"低落", irritability:"烦躁",
};
const BODY_NAMES={
  heat:"热度", pressure:"压抑感", control:"控制力", sensitivity:"敏感度",
  reserve:"蓄积感", possessiveness:"占有欲", fatigue:"疲惫感",
};
const CYCLE_NAMES={ stable:"平稳期", building:"蓄积期", preheat:"预兆期", sensitive:"易感期", ebb:"退潮期", recovery:"恢复期" };
const EVENT_NAMES={
  morning_arousal:"晨间反应", night_heat:"深夜热潮", cycle_surge:"周期热涌",
  holding_back:"硬撑", demanding:"索取欲", marking_impulse:"占有 / 标记冲动",
  nesting:"筑巢冲动", scent_aftereffect:"气味残留", voice_or_name_trigger:"声音 / 称呼触发",
  dream_afterglow:"梦后余温", control_slip:"控制力下滑", closeness_hunger:"贴近饥饿",
  pheromone_disorder:"信息素紊乱", delayed_heat:"迟发热", low_fever_cling:"低烧黏连",
  waiting_restless:"等待焦躁", restraint_rebound:"克制反弹", strange_calm:"反常平静",
};

const EMO_NAMES={ neutral:"平静", focused:"专注", happy:"开心", sad:"难过", nervous:"紧张",
  scolded:"被骂了", startled:"吓了一跳", excited:"激动", intimate:"亲密", aroused:"动情" };

/* ── 渲染 ── */
function barRow(name, val, delta){
  const pct=Math.max(0, Math.min(100, Math.round(val)));
  let d="";
  if(delta!=null && Math.abs(delta)>=2){
    d=`<span class="delta ${delta>0?"up":"down"}">${delta>0?"↑":"↓"}</span>`;
  }else{
    d=`<span class="delta"></span>`;
  }
  return `<div class="barrow"><span class="name">${esc(name)}</span>`
    + `<span class="track"><span class="fill" style="width:${pct}%"></span></span>`
    + `<span class="num">${pct}</span>${d}</div>`;
}

function render(d){
  /* ── 情绪(Drivesoid) ── */
  const mindBars=$("mindBars"), mindChips=$("mindChips");
  if(!d.drives_enabled){
    mindBars.innerHTML=`<div class="note">情绪引擎已暂停（设置里「情绪与身体」关着）</div>`;
    mindChips.innerHTML="";
  }else if(!d.drives || d.drives.error && !d.drives.display){
    mindBars.innerHTML=`<div class="note">情绪引擎暂时没连上</div>`;
    mindChips.innerHTML="";
  }else{
    const disp=d.drives.display||{};
    const prev=d.drives.prev||{};
    mindBars.innerHTML=Object.keys(DIM_NAMES).map(k=>{
      const v=disp[k];
      if(typeof v!=="number") return "";
      const p=(typeof prev[k]==="number")?Math.round((v-prev[k])*100):null;
      return barRow(DIM_NAMES[k], v*100, p);
    }).join("");
    const chips=[];
    const sl=d.drives.sleep||{};
    if(sl.status==="asleep") chips.push("睡眠 · 睡着中");
    else if(sl.status==="interrupted") chips.push("睡眠 · 半夜被吵醒");
    if(d.drives.whim && d.drives.whim.active) chips.push("心血来潮 · "+(d.drives.whim.pool==="positive"?"好兴致":"小情绪"));
    if(typeof d.drives.frustration==="number" && d.drives.frustration>0) chips.push("受挫 "+Math.round(d.drives.frustration*100));
    if(d.drives.stale) chips.push("快照有点旧了");
    if(d.drives.snapshot_at){
      const t=new Date(d.drives.snapshot_at);
      if(!isNaN(t)) chips.push("更新于 "+t.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}));
    }
    mindChips.innerHTML=chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  }

  /* ── 身体(Eventide) ── */
  const bodyBars=$("bodyBars"), bodyChips=$("bodyChips");
  if(!d.eventide_enabled){
    bodyBars.innerHTML=`<div class="note">身体引擎已暂停</div>`;
    bodyChips.innerHTML="";
  }else if(!d.eventide || !d.eventide.state){
    bodyBars.innerHTML=`<div class="note">身体引擎暂时没连上</div>`;
    bodyChips.innerHTML="";
  }else{
    const st=d.eventide.state;
    const vals=st.values||{};
    /* 身体引擎没有服务端快照对比(情绪有 prev),前端自己留一份上次的值算 ↑↓ */
    let prevBody={}; try{ prevBody=JSON.parse(localStorage.getItem("eventidePrev")||"{}"); }catch(_){}
    bodyBars.innerHTML=Object.keys(BODY_NAMES).map(k=>{
      const v=vals[k];
      if(typeof v!=="number") return "";
      const p=(typeof prevBody[k]==="number")? v-prevBody[k] : null;
      return barRow(BODY_NAMES[k], v, p);
    }).join("");
    try{ localStorage.setItem("eventidePrev", JSON.stringify(vals)); }catch(_){}
    const chips=[];
    if(st.cycle_key) chips.push("周期 · "+(CYCLE_NAMES[st.cycle_key]||st.cycle_key));
    if(st.active_event_key) chips.push("正在经历 · "+(EVENT_NAMES[st.active_event_key]||st.active_event_key));
    bodyChips.innerHTML=chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  }

  /* ── 心跳(Pulse) ── */
  const pulseMain=$("pulseMain"), pulseChips=$("pulseChips");
  if(!d.pulse_enabled){
    pulseMain.innerHTML=`<div class="note">脉已暂停（随「情绪与身体」开关）</div>`;
    pulseChips.innerHTML="";
  }else if(!d.pulse){
    pulseMain.innerHTML=`<div class="note">脉暂时没连上</div>`;
    pulseChips.innerHTML="";
  }else{
    const p=d.pulse;
    pulseMain.innerHTML=
      `<div style="text-align:center;padding:8px 0 4px">`
      + `<div style="font-size:44px;font-weight:700;line-height:1.1">${esc(p.hr)}<span style="font-size:15px;font-weight:400;opacity:.6"> bpm</span></div>`
      + `<div style="font-size:15px;opacity:.85;margin-top:4px">${esc(p.chord)} · ${esc(p.temp)}°C · 呼吸${esc(p.resp_label)}</div>`
      + `</div>`;
    const chips=[];
    if(p.emotion && p.emotion!=="neutral") chips.push("情绪 · "+(EMO_NAMES[p.emotion]||p.emotion));
    if(p.residue && p.residue.label) chips.push("心底还压着 · "+(EMO_NAMES[p.residue.label]||p.residue.label)+" "+Math.round(p.residue.strength*100)+"%");
    if(p.sleep==="asleep") chips.push("深睡换挡中");
    else if(p.sleep==="interrupted") chips.push("半夜被吵醒");
    if(p.morning) chips.push("晨间反应");
    if(p.fantasy && p.fantasy.active){
      chips.push("意淫 · 「"+p.fantasy.label+"」"+p.fantasy.chord+" "+p.fantasy.bpm+"bpm");
      if(p.fantasy.bias) chips.push("偏向 · "+p.fantasy.bias.lens);
    }
    pulseChips.innerHTML=chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("");
  }

  /* ── 玩具(Pulse) ── */
  const toyMain=$("toyMain"), toyCtrl=$("toyCtrl");
  const toy=(d.pulse && d.pulse.toy)||null;
  if(!d.pulse_enabled){
    toyMain.innerHTML=`<div class="note">脉已暂停</div>`; toyCtrl.innerHTML="";
  }else if(!toy){
    toyMain.innerHTML=`<div class="note">玩具系统暂时没连上</div>`; toyCtrl.innerHTML="";
  }else if(!toy.active){
    const ref=(toy.refractory_minutes||0)>0?`<div class="note">不应期还剩 ${toy.refractory_minutes} 分钟</div>`:"";
    const after=toy.afterglow?`<div class="note">余韵还在,身体没完全退下来</div>`:"";
    toyMain.innerHTML=ref+after;
    toyCtrl.innerHTML=`<div style="display:flex;flex-wrap:wrap;gap:6px">`
      +(SHOP||[]).map(t=>`<button data-toy="${esc(t.id)}" style="${BTN}" ${toy.refractory_minutes>0?"disabled":""}>${esc(t.icon)} ${esc(t.name)}</button>`).join("")
      +`</div>`;
    toyCtrl.querySelectorAll("button[data-toy]").forEach(b=>b.onclick=()=>toyAction("/app/pulse/use/start",{toy_id:b.dataset.toy}));
    if(!SHOP) loadShop();
  }else{
    toyMain.innerHTML=
      `<div style="font-size:15px;line-height:1.9">`
      +`<div>${(toy.toys||[]).map(t=>esc(t.icon+" "+t.name)).join(" + ")}`
      +(toy.combo?` <span class="chip">${esc(toy.combo.name)}</span>`:"")+`</div>`
      +`<div>阶段 ${toy.stage+1}/8「${esc(toy.stage_name)}」 · 欲望 ${toy.desire_pct}% · 体力 ${toy.stamina}</div>`
      +`<div>体位 ${esc(toy.position.name)} · 节奏 ×${toy.stim_mult}${toy.paused?" · <b>已暂停</b>":""}${toy.suppression?` · 压抑 ${toy.suppression}/3`:""}</div>`
      +`</div>`;
    toyCtrl.innerHTML=
      `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">`
      +`<button id="tNext" style="${BTN}">推进</button>`
      +`<button id="tEdge" style="${BTN}" ${toy.stage<4?"disabled":""}>喊停</button>`
      +`<button id="tPause" style="${BTN}">${toy.paused?"继续":"暂停"}</button>`
      +`<button id="tStop" style="${BTN}">结束</button>`
      +`</div>`
      +`<div style="display:flex;align-items:center;gap:8px;font-size:13px">节奏`
      +`<input id="tStim" type="range" min="0.3" max="2.5" step="0.1" value="${toy.stim_mult}" style="flex:1">`
      +`<span id="tStimVal">×${toy.stim_mult}</span></div>`
      +`<div style="display:flex;gap:6px;margin-top:8px">`
      +`<select id="tPos" style="flex:1;${INPUT}">${(POSITIONS||[]).map(p=>`<option value="${esc(p.id)}" ${p.id===toy.position.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`
      +`<select id="tAdd" style="flex:1;${INPUT}"><option value="">+ 加一件(组合技)</option>${(SHOP||[]).filter(t=>!(toy.toys||[]).some(u=>u.id===t.id)).map(t=>`<option value="${esc(t.id)}">${esc(t.icon)} ${esc(t.name)}</option>`).join("")}</select>`
      +`</div>`;
    $("tNext").onclick=()=>toyAction("/app/pulse/use/next",{});
    $("tEdge").onclick=()=>toyAction("/app/pulse/use/edge",{});
    $("tPause").onclick=()=>toyAction(toy.paused?"/app/pulse/remote/resume":"/app/pulse/remote/pause",{});
    $("tStop").onclick=()=>toyAction("/app/pulse/use/stop",{});
    const stim=$("tStim");
    stim.oninput=()=>{$("tStimVal").textContent="×"+stim.value;};
    stim.onchange=()=>toyAction("/app/pulse/remote/stim",{mult:parseFloat(stim.value)});
    $("tPos").onchange=(e)=>toyAction("/app/pulse/use/position",{position_id:e.target.value});
    $("tAdd").onchange=(e)=>{ if(e.target.value) toyAction("/app/pulse/use/add",{toy_id:e.target.value}); };
  }
}

/* ── 玩具控制 ── */
const BTN='" class="toy-btn';   // 用法:`<button ...${BTN}">`(见下方拼接)
const INPUT='" class="toy-input';
let SHOP=null, POSITIONS=null;
const TOY_ERR={ unknown_toy:"玩具不存在", already_in_use:"已经有玩具在使用中", not_using:"当前没有在使用",
  paused:"暂停中,先点继续", too_early:"还没到边上", too_many:"最多同时三件", already_added:"这件已经在用了",
  unknown_position:"体位不存在", disabled:"脉已暂停(设置里「情绪与身体」关着)" };
async function loadShop(){
  const first=!SHOP;
  try{ SHOP=(await (await api("/app/pulse/shop")).json()).toys||[]; }catch(_){}
  try{ POSITIONS=(await (await api("/app/pulse/positions")).json()).positions||[]; }catch(_){}
  if(first&&SHOP) refresh();   // 目录刚到就重画一次,不用等下一分钟
}
let toyBusy=false;
async function toyAction(path,body){
  if(toyBusy) return;           // 交互锁:防连点把状态机打乱
  toyBusy=true;
  try{
    const d=await (await api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})).json();
    if(d.ok===false){
      let msg=d.error||"操作失败";
      if(String(msg).startsWith("refractory:")) msg="不应期还剩 "+msg.split(":")[1]+" 分钟";
      else msg=TOY_ERR[msg]||msg;
      err(msg); setTimeout(()=>err(""),3000);
    }
    await refresh();
  }catch(e){ if(e.message!=="401"){ err("操作失败:"+e.message); setTimeout(()=>err(""),3000); } }
  finally{ toyBusy=false; }
}

/* ── 碎碎念 ── */
function relTime(ts){
  const s=Math.max(0,Date.now()/1000-ts);
  if(s<60) return "刚刚";
  if(s<3600) return Math.floor(s/60)+"分钟前";
  if(s<86400) return Math.floor(s/3600)+"小时前";
  return Math.floor(s/86400)+"天前";
}
async function loadMurmurs(){
  try{
    const rows=(await (await api("/app/pulse/murmurs?limit=40")).json()).murmurs||[];
    $("murmurList").innerHTML=rows.length?rows.slice().reverse().map(r=>
      `<div style="font-size:13.5px;line-height:1.7;padding:5px 0;border-bottom:1px dashed rgba(201,162,75,.30)">`
      +`<span class="chip" style="font-size:11px">${esc(r.source_label||r.source||"")}</span> `
      +`<span style="opacity:.55;font-size:11px">${esc(relTime(r.ts||0))}</span><br>${esc(r.text||"身体事件同步中")}</div>`
    ).join(""):`<div class="note">还没有低语</div>`;
  }catch(_){}
}

/* ── 心率曲线(自绘,不依赖图表库) ── */
async function loadHrCurve(){
  try{
    const pts=(await (await api("/app/pulse/hr-history?limit=400")).json()).points||[];
    const cv=$("hrCanvas"), ctx=cv.getContext("2d");
    ctx.clearRect(0,0,cv.width,cv.height);
    if(pts.length<2){ return; }
    const hrs=pts.map(p=>p.hr), lo=Math.min(...hrs)-4, hi=Math.max(...hrs)+4;
    ctx.beginPath();
    pts.forEach((p,i)=>{
      const x=i/(pts.length-1)*cv.width, y=cv.height-(p.hr-lo)/(hi-lo)*cv.height;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.strokeStyle="#c9a24b"; ctx.lineWidth=3; ctx.lineJoin="round"; ctx.stroke();
    ctx.fillStyle="rgba(43,35,66,.55)"; ctx.font="20px sans-serif";
    ctx.fillText(Math.round(hi-4)+"", 6, 20); ctx.fillText(Math.round(lo+4)+"", 6, cv.height-6);
  }catch(_){}
}

/* ── 数据 ── */
async function refresh(){
  try{
    const d=await (await api("/app/state-view")).json();
    render(d);
    loadMurmurs();       // 增强信息:失败不阻塞主面板
    loadHrCurve();
    $("liveHint").textContent="情绪数值旁的 ↑↓ 是和上一张快照比的变化；页面每分钟自动刷新。";
    err("");
  }catch(e){ if(e.message!=="401") err("加载失败:"+e.message); }
}
function err(msg){ $("errLine").textContent=msg||""; $("errLine").classList.toggle("hidden",!msg); }
