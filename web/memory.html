<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>记忆仓库 · Memory Vault</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/500.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/400.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/500.min.css" rel="stylesheet">
<link rel="preload" href="assets/sdv/bg_title.png" as="image">
<meta name="theme-color" content="#0d0920">

<script>
  /* Motra — dark glassmorphism theme (single preset). */
  (function(){ document.documentElement.setAttribute("data-theme","tide"); })();
</script>

<style>
/* ───────── Motra · dark glassmorphism (shared with the PWA) ───────── */
:root{
  --font-en:"FusionPixel","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-cn:"FusionPixel","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-script:"FusionPixel","Noto Sans SC",system-ui,sans-serif;

  --bg:#f8f3ed;
  --wall:url("assets/sdv/bg_title.png");
  --text:#3a2b22;
  --text-soft:#6b5346;
  --text-faint:#9a7f6e;
  --accent:#c2587c;
  --accent-deep:#c2587c;
  --accent-fg:#fff8ee;
  --hairline:rgba(91,63,63,.28);
  --card-bg:#f8f3ed;
  --card-line:rgba(91,63,63,.30);
  --field-bg:#f8f3ed;
  --field-line:#5b3f3f;
  --sheet-bg:#f8f3ed;
  --sheet-line:#5b3f3f;
  --sheet-hi:rgba(255,255,255,.5);
  --shadow:6px 6px 0 rgba(60,42,32,.18);
  --soft-shadow:4px 4px 0 rgba(60,42,32,.12);
  --scrim:linear-gradient(180deg,rgba(248,243,237,.30) 0%,rgba(248,243,237,.18) 30%,rgba(248,243,237,.22) 68%,rgba(248,243,237,.42) 100%);
  --danger:#b8433a;
  /* 记忆仓库专用 */
  --vault-a:rgba(255,255,255,.14);
  --vault-b:rgba(255,255,255,.05);
  --vault-line:rgba(255,255,255,.12);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-cn); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
.wall{ position:fixed; inset:0; z-index:-2; background:var(--bg) var(--wall) center/cover no-repeat; }
.wall::after{ content:""; position:absolute; inset:0; background:var(--scrim); }
img{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
a{ color:inherit; text-decoration:none; }
.hidden{ display:none !important; }

.glass{ background:var(--field-bg); border:1px solid var(--field-line);
  box-shadow:var(--soft-shadow), inset 0 1px 0 var(--sheet-hi);
  -webkit-backdrop-filter:blur(16px) saturate(1.25); backdrop-filter:blur(16px) saturate(1.25); }

/* ───────── 顶栏 ───────── */
.bar{
  position:sticky; top:0; z-index:30; display:flex; align-items:flex-start; gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) clamp(16px,5vw,28px) 4px;
  background:linear-gradient(180deg,rgba(5,13,20,.72),rgba(5,13,20,0));
  -webkit-backdrop-filter:blur(12px) saturate(1.15); backdrop-filter:blur(12px) saturate(1.15);
}
.bar .icon{ width:36px; height:36px; margin-top:-3px; margin-left:-7px; display:grid; place-items:center; border-radius:50%;
  color:var(--text); transition:background .2s,transform .15s; }
.bar .icon:active{ transform:scale(.9); background:var(--hairline); }
.bar .icon svg{ width:23px; height:23px; }
.bar .grow{ flex:1; }
.top-label{ text-align:right; font-family:var(--font-en); font-size:11.5px; font-weight:500;
  letter-spacing:.32em; line-height:1.4; color:var(--text-faint); padding-right:2px; }
.top-label .rule{ display:block; width:28px; height:1px; background:var(--hairline); margin:5px 0 0 auto; }

.wrap{ max-width:560px; margin:0 auto; padding:0 clamp(16px,5vw,28px) calc(22px + env(safe-area-inset-bottom)); position:relative; z-index:1; }

/* ───────── Hero ───────── */
.hero{ text-align:left; padding:2px 0 4px; }
.hero h1{ font-family:var(--font-script); font-weight:400; color:var(--text);
  font-size:clamp(31px,9.6vw,43px); line-height:1; margin:0; }
.hero .sub{ font-family:var(--font-en); font-style:italic; font-size:clamp(13px,3.8vw,16px);
  color:var(--text-soft); margin-top:0; letter-spacing:.01em; }

/* ───────── 门厅卡片 ───────── */
.vault{ position:relative; margin:10px 0 14px; border-radius:26px; padding:30px 24px 26px;
  background:linear-gradient(158deg,var(--vault-a) 0%,var(--vault-b) 62%,rgba(255,255,255,.02) 100%);
  border:1px solid var(--vault-line);
  box-shadow:var(--soft-shadow), inset 0 1.5px 0 rgba(255,255,255,.12), inset 0 -14px 26px rgba(0,0,0,.20);
  animation:popIn .5s both; text-align:center; }
.vault .seal{ width:64px; height:64px; margin:0 auto 14px; display:grid; place-items:center; border-radius:50%;
  background:rgba(255,255,255,.12); border:1px solid var(--vault-line); color:var(--accent); box-shadow:var(--soft-shadow); }
.vault .seal svg{ width:30px; height:30px; }
.vault .who{ font-family:var(--font-en); font-style:italic; font-size:13px; letter-spacing:.14em;
  color:var(--text-faint); text-transform:uppercase; }
.vault h2{ font-family:var(--font-cn); font-weight:500; font-size:20px; margin:6px 0 10px; color:var(--text); }
.vault p{ font-family:var(--font-cn); font-size:13.5px; line-height:1.85; color:var(--text-soft); margin:0 auto; max-width:330px; }

/* 跳转大按钮(真链接) */
.jump{ display:flex; align-items:center; justify-content:center; gap:8px; margin:22px auto 6px; max-width:330px;
  padding:14px; border-radius:16px; background:var(--accent-deep); color:var(--accent-fg); box-shadow:var(--soft-shadow);
  font-family:var(--font-cn); font-size:15px; letter-spacing:.04em; transition:transform .15s; }
.jump svg{ width:16px; height:16px; color:rgba(10,22,32,.82); }
.jump:active{ transform:scale(.96); }
.url-line{ font-family:var(--font-en); font-size:11.5px; letter-spacing:.02em; color:var(--text-faint);
  text-align:center; margin:8px 0 0; word-break:break-all; }

/* 未配置状态卡 */
.setup{ margin:10px 0 14px; border-radius:22px; padding:24px 22px; text-align:center; animation:popIn .5s both; }
.setup .big{ font-size:30px; line-height:1; margin-bottom:8px; }
.setup h2{ font-family:var(--font-cn); font-weight:500; font-size:17px; margin:0 0 8px; color:var(--text); }
.setup p{ font-family:var(--font-cn); font-size:13px; line-height:1.8; color:var(--text-soft); margin:0 0 16px; }
.setup .src{ display:inline-block; margin:0 4px; padding:2px 9px; border-radius:12px;
  background:rgba(255,255,255,.12); border:1px solid var(--card-line); font-size:12px; color:var(--accent); }
.home-btn{ display:inline-flex; align-items:center; gap:7px; padding:12px 26px; border-radius:14px;
  background:var(--accent-deep); color:var(--accent-fg); font-family:var(--font-cn); font-size:14px; letter-spacing:.03em;
  box-shadow:var(--soft-shadow); transition:transform .15s; }
.home-btn:active{ transform:scale(.96); }

/* 未登录卡 */
.need-login{ margin:10px 0 14px; border-radius:22px; padding:24px 22px; text-align:center; }
.need-login p{ font-family:var(--font-cn); font-size:13.5px; color:var(--text-soft); margin:0 0 16px; line-height:1.8; }

.hint{ text-align:center; font-family:var(--font-cn); font-size:12px; color:var(--text-faint); margin:6px 0 2px; }

@keyframes popIn{ from{ opacity:0; transform:translateY(10px) scale(.99);} }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; } }

/* ═══ SDV 像素皮肤覆盖(与主 app 同族) ═══ */
@font-face{ font-family:"FusionPixel"; src:url("fonts/fusion-pixel-zh.woff2") format("woff2"); font-display:swap;
  unicode-range: U+0000-00FF, U+2000-206F, U+3000-303F, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF; }
.wall{ image-rendering:pixelated; }
.bar{ background:linear-gradient(180deg,rgba(248,243,237,.88),rgba(248,243,237,0)); -webkit-backdrop-filter:none; backdrop-filter:none; }
.bar .icon{ background:#f8f3ed; border:3px solid #5b3f3f; border-radius:10px; box-shadow:3px 3px 0 rgba(60,42,32,.20); color:#3a2b22; }
.bar .icon:active{ background:#efe4d6; }
.top-label{ color:#9a7f6e; }
.hero h1{ color:#3a2b22; text-shadow:2px 2px 0 rgba(91,63,63,.18); }
.hero .sub{ font-style:normal; }
.glass{ background:#f8f3ed; border:3px solid #5b3f3f; border-radius:14px;
  box-shadow:4px 4px 0 rgba(60,42,32,.16); -webkit-backdrop-filter:none; backdrop-filter:none; }
/* 门厅卡 → 木框 */
.vault{ background:none; border:18px solid transparent; border-radius:0;
  border-image:url("assets/sdv/frame_wood.png") 128 fill / 18px / 0 stretch;
  box-shadow:5px 5px 0 rgba(60,42,32,.22); image-rendering:pixelated; }
.vault .seal{ background:#efe4d6; border:2px solid rgba(91,63,63,.35); color:#c2587c; box-shadow:none; border-radius:12px; }
.vault .who{ font-style:normal; color:#9a7f6e; }
.url-line{ color:#9a7f6e; }
.setup .src{ background:#efe4d6; border:2px solid rgba(91,63,63,.30); color:#9e4462; }
/* 按钮 */
.jump, .home-btn{ background:#c2587c; color:#fff8ee; border:3px solid #5b3f3f; border-radius:8px;
  box-shadow:0 3px 0 #5b3f3f; font-weight:600; }
.jump svg{ color:#fff8ee; }
.jump:active, .home-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #5b3f3f; }
html[data-theme="tide"] body{background:#0d0920;color:#efeaf9;font-family:"Noto Sans SC","PingFang SC",sans-serif;}
html[data-theme="tide"] .wall{z-index:-2;background:linear-gradient(180deg,rgba(13,9,32,.38),rgba(13,9,32,.72) 62%,rgba(13,9,32,.9)),url("assets/night/sky-gold.webp") center/cover no-repeat;image-rendering:auto;}
html[data-theme="tide"] .wall::after{background:radial-gradient(circle at 50% 20%,rgba(185,168,232,.14),transparent 38%),linear-gradient(180deg,rgba(13,9,32,.08),rgba(13,9,32,.38));}
html[data-theme="tide"] .bar{background:linear-gradient(180deg,rgba(13,9,32,.88),rgba(13,9,32,.18) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);}
html[data-theme="tide"] .bar .icon{background:rgba(18,14,43,.66);border:1px solid rgba(227,194,132,.72);border-radius:50%;box-shadow:0 0 0 4px rgba(227,194,132,.06),0 8px 18px rgba(0,0,0,.3);color:#e3c284;}
html[data-theme="tide"] .bar .icon:active{background:rgba(227,194,132,.15);}
html[data-theme="tide"] .top-label{font-family:"Cormorant",serif;color:#e3c284;letter-spacing:.34em;}
html[data-theme="tide"] .top-label .rule{background:linear-gradient(90deg,transparent,rgba(227,194,132,.58));}
html[data-theme="tide"] .hero{text-align:center;padding:20px 0 14px;}
html[data-theme="tide"] .hero::before{content:"";display:block;width:18px;height:18px;margin:0 auto 10px;background:url("assets/sdv/sparkle_s.png") center/contain no-repeat;filter:sepia(1) saturate(.65) brightness(1.35) drop-shadow(0 0 8px rgba(227,194,132,.55));opacity:.9;}
html[data-theme="tide"] .hero h1{font-family:"Cormorant",serif;font-size:clamp(34px,10vw,46px);font-weight:500;letter-spacing:.12em;color:#efeaf9;text-shadow:0 0 24px rgba(185,168,232,.18);}
html[data-theme="tide"] .hero .sub{font-family:"GreatVibes","Cormorant",cursive;font-style:normal;font-size:22px;color:#e3c284;letter-spacing:.02em;}
html[data-theme="tide"] .vault{margin:12px 0 18px;padding:36px 24px 28px;border-radius:24px;background:linear-gradient(145deg,rgba(247,242,255,.16),rgba(48,34,91,.22) 52%,rgba(227,194,132,.08));border:1px solid rgba(227,194,132,.72);box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 0 4px rgba(227,194,132,.05),inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 34px rgba(185,168,232,.1);-webkit-backdrop-filter:blur(20px) saturate(1.25);backdrop-filter:blur(20px) saturate(1.25);image-rendering:auto;}
html[data-theme="tide"] .vault::before{content:"";position:absolute;inset:10px;border:1px solid rgba(227,194,132,.22);border-radius:17px;pointer-events:none;}
html[data-theme="tide"] .vault::after{content:"";position:absolute;right:20px;top:18px;width:22px;height:22px;background:url("assets/sdv/sparkle_s.png") center/contain no-repeat;filter:sepia(1) saturate(.7) brightness(1.25) drop-shadow(0 0 8px rgba(227,194,132,.55));opacity:.75;pointer-events:none;}
html[data-theme="tide"] .vault .seal{width:70px;height:70px;margin:0 auto 15px;background:rgba(18,14,43,.46);border:1px solid rgba(227,194,132,.78);color:#e3c284;box-shadow:0 0 0 5px rgba(227,194,132,.06),inset 0 0 20px rgba(185,168,232,.14);}
html[data-theme="tide"] .vault .seal svg{width:31px;height:31px;}
html[data-theme="tide"] .vault .who{font-family:"Cormorant",serif;font-style:normal;font-size:11px;letter-spacing:.3em;color:#c9a24b;}
html[data-theme="tide"] .vault h2{font-family:"Cormorant","Noto Sans SC",serif;font-size:25px;letter-spacing:.1em;color:#f7edcf;margin:8px 0 12px;}
html[data-theme="tide"] .vault p{font-family:"Noto Sans SC","PingFang SC",sans-serif;font-size:13.5px;line-height:1.9;color:#d8d0e8;max-width:350px;}
html[data-theme="tide"] .jump{margin:24px auto 8px;max-width:300px;padding:13px 18px;border-radius:999px;background:linear-gradient(135deg,rgba(227,194,132,.96),rgba(201,162,75,.9));border:1px solid rgba(255,235,179,.9);box-shadow:0 10px 26px rgba(0,0,0,.32),0 0 18px rgba(227,194,132,.14),inset 0 1px 0 rgba(255,255,255,.45);color:#2b2342;font-family:"Noto Sans SC",sans-serif;font-size:14px;font-weight:500;}
html[data-theme="tide"] .jump svg{color:#2b2342;}
html[data-theme="tide"] .jump:active{transform:scale(.96);}
html[data-theme="tide"] .url-line{font-family:"Cormorant",serif;color:#a79fca;letter-spacing:.05em;}
html[data-theme="tide"] .glass,html[data-theme="tide"] .setup,html[data-theme="tide"] .need-login{background:rgba(18,14,43,.5);border:1px solid rgba(227,194,132,.5);border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);}
html[data-theme="tide"] .setup h2,html[data-theme="tide"] .need-login p{color:#efeaf9;}
html[data-theme="tide"] .setup p{color:#c9c0dd;}
html[data-theme="tide"] .setup .src{background:rgba(185,168,232,.12);border:1px solid rgba(227,194,132,.42);color:#e3c284;}
html[data-theme="tide"] .home-btn{background:rgba(227,194,132,.9);border:1px solid rgba(255,235,179,.9);border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.3);color:#2b2342;}
html[data-theme="tide"] .hint{color:#a79fca;}
</style>
</head>
<body>
<div class="wall"></div>

<!-- 顶栏 -->
<div class="bar">
  <button class="icon" id="topBack" title="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <span class="grow"></span>
  <div class="top-label" id="topLabel">MEMORY<br>VAULT<span class="rule"></span></div>
</div>

<div class="wrap" id="mainView">
  <div class="hero">
    <h1>Memory Vault</h1>
    <div class="sub">a door to his long-term memory.</div>
  </div>

  <!-- 已配置:跳转门厅 -->
  <div class="vault hidden" id="vaultCard">
    <div class="seal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c.8 5 3.5 7.7 8.5 8.5-5 .8-7.7 3.5-8.5 8.5-.8-5-3.5-7.7-8.5-8.5 5-.8 7.7-3.5 8.5-8.5Z"/></svg>
    </div>
    <div class="who">his long-term memory</div>
    <h2 id="vaultTitle">他的记忆仓库</h2>
    <p id="vaultText">他的长期记忆在 OB 那边安了家，有自己的脑袋。这里不开门进去看他的底稿，只是帮你轻轻推一扇窗——点下面的门，去他的仓库里逛逛。</p>
    <a class="jump" id="jumpBtn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/><path d="M14 4h6v6M20 4l-9 9"/></svg>
      打开他的记忆仓库
    </a>
    <div class="url-line" id="urlLine"></div>
  </div>

  <!-- 未配置 -->
  <div class="setup glass hidden" id="setupCard">
    <div class="big">🗝️</div>
    <h2>这扇门的地址还没填</h2>
    <p>去主页的设置里，把 OB dashboard 的链接填进<span class="src">设置 → 连接与工具 → 记忆仓库</span>，回来这里就有门了。</p>
    <button class="home-btn" id="setupHome" type="button">回主页去设置</button>
  </div>

  <!-- 未登录 -->
  <div class="need-login glass hidden" id="loginCard">
    <p>还没读到访问密钥。先在主页登录，再回来推开这扇门。</p>
    <button class="home-btn" id="loginHome" type="button">去主页</button>
  </div>

  <div class="hint hidden" id="errLine" style="color:var(--danger)"></div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   Memory Vault — 记忆仓库门厅。
   只做一件事:从 loop 配置读 memory_url(OB dashboard 公网链接),
   渲染一扇门,点了跳到那边。不碰记忆的读写。
   ───────────────────────────────────────────────────────────── */
const API_BASE="/relay";
const LS_KEY="companion_secret";
const secret=localStorage.getItem(LS_KEY)||"";

const $=(id)=>document.getElementById(id);
function authHeaders(){ return {"Authorization":"Bearer "+secret}; }

function showOnly(id){
  $("vaultCard").classList.toggle("hidden", id!=="vault");
  $("setupCard").classList.toggle("hidden", id!=="setup");
  $("loginCard").classList.toggle("hidden", id!=="login");
}

async function boot(){
  if(!secret){ showOnly("login"); return; }
  try{
    const r=await fetch(API_BASE+"/app/loop_config",{headers:authHeaders()});
    if(r.status===401){ showOnly("login"); return; }
    if(!r.ok){ showOnly("setup"); return; }
    const cfg=await r.json();
    const url=(cfg&&cfg.memory_url)||"";
    if(url){
      $("jumpBtn").href=url;
      $("urlLine").textContent=url.replace(/^https?:\/\//,"");
      showOnly("vault");
    }else{
      showOnly("setup");
    }
  }catch(e){
    $("errLine").textContent="读取配置失败："+(e.message||"请检查连接");
    $("errLine").classList.remove("hidden");
    showOnly("setup");
  }
}

$("topBack").onclick=()=>{
  // 从聊天页点进来的:history.back() 直接回到原位(bfcache 秒还原,不整页重载、不闪登录页)
  if (document.referrer && document.referrer.indexOf(location.origin) === 0) history.back();
  else location.assign("index.html");
};
$("setupHome").onclick=()=>{ location.assign("index.html"); };
$("loginHome").onclick=()=>{ location.assign("index.html"); };

boot();
</script>
</body>
</html>
